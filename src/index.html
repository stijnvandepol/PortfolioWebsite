<!DOCTYPE html>
<html lang="nl" data-theme="dark" data-accent="blue">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Portfolio van Stijn van de Pol — IT Infrastructure & Cybersecurity, gepresenteerd als macOS-desktop.">
  <title>Stijn van de Pol — Portfolio</title>

  <link rel="icon" href="./assets/images/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="./assets/images/favicon.ico" sizes="48x48">
  <link rel="apple-touch-icon" href="./assets/images/apple-touch-icon.png">
  <meta name="theme-color" content="#0A84FF">
  <link rel="stylesheet" href="./assets/css/tokens.css?v=7">
  <link rel="stylesheet" href="./assets/css/style.css?v=7">
  <!-- Desktop- en mobiele CSS laden voorwaardelijk: het niet-passende bestand blokkeert het renderen niet. -->
  <link rel="stylesheet" href="./assets/css/os.css?v=7" media="(min-width: 769px)">
  <link rel="stylesheet" href="./assets/css/apps.css?v=7" media="(min-width: 769px)">
  <link rel="stylesheet" href="./assets/css/mobile.css?v=7" media="(max-width: 768px)">
  <script src="./assets/js/preboot.js"></script>
  <!-- Modules die desktop én mobiel nodig hebben: parallel ophalen i.p.v. als keten -->
  <link rel="modulepreload" href="./assets/js/core/theme.js">
  <link rel="modulepreload" href="./assets/js/core/store.js">
  <link rel="modulepreload" href="./assets/js/core/dom.js">
  <link rel="modulepreload" href="./assets/js/data/config.js">
  <link rel="modulepreload" href="./assets/js/apps/icons.js">
</head>

<body>
  <!-- ===== BOOT SCREEN ===== -->
  <div class="boot-screen" id="boot" aria-hidden="true">
    <div class="boot-name">
      <span>S</span><span>t</span><span>i</span><span>j</span><span>n</span><span class="space">&nbsp;</span><span>v</span><span>a</span><span>n</span><span class="space">&nbsp;</span><span>d</span><span>e</span><span class="space">&nbsp;</span><span>P</span><span>o</span><span>l</span>
    </div>
    <div class="boot-bar-wrap"><div class="boot-bar"></div></div>
  </div>

  <!-- ===== DESKTOP (door JS gevuld) ===== -->
  <main class="desktop" id="desktop">
    <div class="wallpaper" aria-hidden="true"></div>
  </main>


  <noscript>
    <div style="position:fixed;inset:0;display:grid;place-items:center;background:#0d0d14;color:#f5f5f7;font-family:system-ui;padding:2rem;text-align:center">
      Deze interactieve portfolio vereist JavaScript. Bekijk anders mijn werk op
      <a href="https://github.com/stijnvandepol" style="color:#0A84FF">github.com/stijnvandepol</a>.
    </div>
  </noscript>

  <script type="module" src="./assets/js/main.js?v=2"></script>
</body>
</html>
